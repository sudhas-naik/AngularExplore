<div class="filters">
  <input
    type="search"
    placeholder="Search issues"
    [ngModel]="board.filters().query"
    (ngModelChange)="board.setFilters({ query: $event })"
  />
  <select
    [ngModel]="board.filters().assigneeId"
    (ngModelChange)="board.setFilters({ assigneeId: $event })"
  >
    <option value="">All assignees</option>
    <option value="unassigned">Unassigned</option>
    @for (user of board.users; track user.id) {
      <option [value]="user.id">{{ user.name }}</option>
    }
  </select>
  <select
    [ngModel]="board.filters().type"
    (ngModelChange)="board.setFilters({ type: $event })"
  >
    <option value="">All types</option>
    @for (type of types; track type) {
      <option [value]="type">{{ typeMeta[type].label }}</option>
    }
  </select>
  <select
    [ngModel]="board.filters().priority"
    (ngModelChange)="board.setFilters({ priority: $event })"
  >
    <option value="">All priorities</option>
    @for (priority of priorities; track priority) {
      <option [value]="priority">{{ priorityMeta[priority].label }}</option>
    }
  </select>
  <label class="mine">
    <input
      type="checkbox"
      [ngModel]="board.filters().onlyMine"
      (ngModelChange)="board.setFilters({ onlyMine: $event })"
    />
    Only my issues
  </label>
  <span class="count">{{ matched() }} of {{ total() }}</span>
</div>
