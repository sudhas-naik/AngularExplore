<section class="task-list">
  <div class="heading">
    <div>
      <h1>Tasks</h1>
      <p>Manage tasks with a shared service and child components.</p>
    </div>
    <a routerLink="/tasks/new" class="btn">Add task</a>
  </div>

  @if (tasks().length === 0) {
    <p class="empty">No tasks yet. Create your first one.</p>
  } @else {
    <ul>
      @for (task of tasks(); track task.id) {
        <li>
          <app-task-item
            [task]="task"
            (statusChange)="onStatusChange($event)"
            (remove)="onRemove($event)"
          />
        </li>
      }
    </ul>
  }
</section>
