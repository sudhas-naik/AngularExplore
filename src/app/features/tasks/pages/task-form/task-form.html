<section class="task-form">
  <h1>Add task</h1>
  <p class="lead">Reactive forms validate input before saving through the service.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Title
      <input type="text" formControlName="title" placeholder="e.g. Practice routing" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <span class="error">Title needs at least 3 characters.</span>
      }
    </label>

    <label>
      Description
      <textarea
        formControlName="description"
        rows="4"
        placeholder="What should be done?"
      ></textarea>
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <span class="error">Description needs at least 5 characters.</span>
      }
    </label>

    <label>
      Status
      <select formControlName="status">
        @for (status of statuses; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </label>

    <div class="actions">
      <button type="submit" class="primary">Save task</button>
      <a routerLink="/tasks" class="link">Cancel</a>
    </div>
  </form>
</section>
